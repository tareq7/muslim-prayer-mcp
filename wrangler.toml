name = "muslim-prayer-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
DEFAULT_CALCULATION_METHOD = "UmmAlQura"
DEFAULT_MADHAB = "Shafi"
DEFAULT_REMINDER_MODE = "prayer_window"
DEFAULT_EXACT_WINDOW_MINUTES = "20"
DEFAULT_LOCALE = "en"

# KV Binding PRAYER_KV can be bound via Cloudflare Dashboard -> Settings -> Bindings
# or configured with a real namespace ID:
# [[kv_namespaces]]
# binding = "PRAYER_KV"
# id = "<your-kv-namespace-id>"
